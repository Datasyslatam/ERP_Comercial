name: CI
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp_ci
          POSTGRES_DB: erp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U erp" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://erp:erp_ci@localhost:5432/erp_test
      DATABASE_URL: postgresql+psycopg://erp:erp_ci@localhost:5432/erp_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: pip install -r backend/requirements-dev.txt
      - run: ruff check backend integrations tests
      # `alembic check` compara el modelo con una base ya migrada; sobre una base vacía siempre falla.
      - run: alembic upgrade head
      - run: alembic check
      - run: pytest -q --cov=app --cov=integrations --cov-report=term

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npx tsc -b
      - run: npm test
      - run: npm run build

  # Construye las imágenes en todas las ramas; solo en main (tras pasar backend y frontend) las publica en
  # GHCR. Railway despliega esas imágenes en lugar de compilar el repositorio (docs/instalacion.md, sección D).
  images:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      REGISTRY: ghcr.io/datasyslatam
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Imagen api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/api.Dockerfile
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ env.REGISTRY }}/erp-api:latest,${{ env.REGISTRY }}/erp-api:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: Imagen web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/web.Dockerfile
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ env.REGISTRY }}/erp-web:latest,${{ env.REGISTRY }}/erp-web:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  # Despliegue en Railway de las imágenes recién publicadas (etiqueta = commit, para saber qué corre y poder
  # volver atrás). Se omite si el repositorio no tiene el secreto RAILWAY_TOKEN: entonces se redespliega a mano.
  deploy:
    runs-on: ubuntu-latest
    needs: images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    concurrency: { group: railway-production, cancel-in-progress: false }
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
    steps:
      - name: Desplegar api y web
        if: env.RAILWAY_TOKEN != ''
        env:
          SERVICES: >-
            ${{ vars.RAILWAY_API_SERVICE_ID }}=ghcr.io/datasyslatam/erp-api:${{ github.sha }}
            ${{ vars.RAILWAY_WEB_SERVICE_ID }}=ghcr.io/datasyslatam/erp-web:${{ github.sha }}
        run: |
          gql() {
            curl -sS --fail-with-body https://backboard.railway.com/graphql/v2 \
              -H "Project-Access-Token: $RAILWAY_TOKEN" -H "Content-Type: application/json" \
              -d "$(jq -n --arg q "$1" --argjson v "$2" '{query: $q, variables: $v}')" | tee /dev/stderr \
              | jq -e '.errors == null' > /dev/null
          }
          for pair in $SERVICES; do
            service="${pair%%=*}"; image="${pair#*=}"
            ids=$(jq -n --arg s "$service" --arg e "$RAILWAY_ENVIRONMENT_ID" '{s: $s, e: $e}')
            gql 'mutation($s: String!, $e: String!, $input: ServiceInstanceUpdateInput!) {
                   serviceInstanceUpdate(serviceId: $s, environmentId: $e, input: $input) }' \
                "$(jq --arg i "$image" '. + {input: {source: {image: $i}}}' <<< "$ids")"
            gql 'mutation($s: String!, $e: String!) { serviceInstanceDeployV2(serviceId: $s, environmentId: $e) }' "$ids"
            echo "Desplegando $image"
          done
      - if: env.RAILWAY_TOKEN == ''
        run: echo "::notice::Imágenes publicadas en GHCR; sin RAILWAY_TOKEN, redespliegue api y web desde el panel de Railway."
