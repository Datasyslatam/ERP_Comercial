name: CI
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp_ci
          POSTGRES_DB: erp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U erp" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://erp:erp_ci@localhost:5432/erp_test
      DATABASE_URL: postgresql+psycopg://erp:erp_ci@localhost:5432/erp_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: pip install -r backend/requirements-dev.txt
      - run: ruff check backend integrations tests
      # `alembic check` compara el modelo con una base ya migrada; sobre una base vacía siempre falla.
      - run: alembic upgrade head
      - run: alembic check
      - run: pytest -q --cov=app --cov=integrations --cov-report=term

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npx tsc -b
      - run: npm test
      - run: npm run build

  images:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/docker/api.Dockerfile -t datasys-erp-api:ci .
      - run: docker build -f deploy/docker/web.Dockerfile -t datasys-erp-web:ci .
